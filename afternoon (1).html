<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

@keyframes sway-small {
  from { transform: translateX(0px); }
  to { transform: translateX(-24px); }
}
@keyframes sway-big {
  from { transform: translateX(0px); }
  to { transform: translateX(-48px); }
}

body {
  min-height: 100%;
  background: linear-gradient(40deg, #1c5a92, #8fd0e8);
  position: relative;
}

.stage { position: relative; height: 100%; overflow: hidden; }

.scene-group {
  position: absolute;
  inset: 0;
  z-index: 2;
  filter: brightness(1.08) saturate(1.05) hue-rotate(0deg);
}

#mountains { position: absolute; bottom: 20%; margin-bottom: -16px; left: 100px; z-index: 2; }
#hills { position: absolute; left: 100px; margin-left: -120px; margin-bottom: -86px; bottom: 20%; z-index: 3; }
#cloud1 { position: absolute; top: 20%; right: 4%; z-index: 2; animation: sway-big 10s ease-in-out 0s infinite alternate; }
#cloud2 { position: absolute; top: 22%; right: 16%; z-index: 1; animation: sway-small 10s ease-in-out 0s infinite alternate; }
.trees { width: 100%; height: 130px; position: absolute; bottom: 20%; margin-bottom: -100px; z-index: 4; }
#ground { z-index: 1; width: 100%; height: 20%; position: absolute; bottom: 0; background: linear-gradient(210deg, #879759, #648459); }
#sky { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; opacity: 0; }
</style>
</head>

</section>

<script>
var sky = document.getElementById("sky");
sky.width = document.body.clientWidth;
sky.height = document.body.clientHeight;

if (sky.getContext) {
    var skyContext = sky.getContext("2d");
    for (var star = 0; star < 240; star++) {
        var min = (Math.random() * 30) / 10;
        var centerX = Math.random() * sky.width;
        var centerY = Math.random() * sky.height * 0.6;
        skyContext.beginPath();
        skyContext.arc(centerX, centerY, min, 0, 2 * Math.PI);
        var opacity = Math.random();
        skyContext.fillStyle = "rgba(255, 255, 255, " + opacity + ")";
        skyContext.fill();
    }
}
</script>
